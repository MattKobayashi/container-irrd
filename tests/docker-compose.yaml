---
name: irrd
services:
  ## Connection Test ##
  connection_test:
    command: ./test.sh
    container_name: connection_test
    depends_on:
      - irrd
    image: debian:trixie-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
    networks:
      - irrd
    restart: "no"
    volumes:
      - type: bind
        source: ./test.sh
        target: /test.sh
  ## IRRd ##
  # Ports: 43/tcp, 8000/tcp
  irrd:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: irrd
    depends_on:
      - irrd_postgres
      - irrd_redis
    networks:
      - irrd
    platform: linux/amd64
    ports:
      - mode: host
        protocol: tcp
        published: 43
        target: 43
      - mode: host
        protocol: tcp
        published: 8000
        target: 8000
      - mode: host
        protocol: tcp
        published: 8080
        target: 8080
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./irrd.yaml
        target: /opt/irrd/irrd.yaml
      - type: bind
        source: ./irrexplorer.yaml
        target: /opt/irrexplorer/irrexplorer.yaml
  ## IRRd Database ##
  # Ports: 5432/tcp
  irrd_postgres:
    command:
      [
        "-c",
        "random_page_cost=1.0",
        "-c",
        "work_mem=50MB",
        "-c",
        "shared_buffers=1GB",
        "-c",
        "max_connections=1000",
      ]
    container_name: irrd_postgres
    environment:
      - "PGDATA=/var/lib/postgresql/data/pgdata"
      - "POSTGRES_DB=irrd"
      - "POSTGRES_PASSWORD=irrd"
      - "POSTGRES_USER=irrd"
    image: "postgres:18.6-alpine@sha256:83148c0bc09eac4d598b70a61e1404d0212b76c95c504bfd6c81a4c59ec91792"
    networks:
      - irrd
    restart: unless-stopped
    volumes:
      - type: volume
        source: irrd_postgres
        target: /var/lib/postgresql/data/
  ## IRRd Redis ##
  # Ports: 6379/tcp
  irrd_redis:
    container_name: irrd_redis
    image: "redis:8.10.2-alpine@sha256:615b4cedaff0c1437a1548acae4222572df8c021eeb7382d64cb8b5e3a13ac7a"
    networks:
      - irrd
    restart: unless-stopped
    volumes:
      - source: redis
        target: /data
        type: volume
networks:
  irrd:
    name: irrd
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.42.0.0/24
        - subnet: fdea:420:cafe::/64
volumes:
  irrd_postgres:
    name: irrd_postgres
  redis:
    name: redis
