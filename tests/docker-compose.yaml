---
name: irrd
services:
  ## Connection Test ##
  connection_test:
    command: ./test.sh
    container_name: connection_test
    depends_on:
      - irrd
    image: debian:trixie-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
    networks:
      - irrd
    restart: "no"
    volumes:
      - type: bind
        source: ./test.sh
        target: /test.sh
  ## IRRd ##
  # Ports: 43/tcp, 8000/tcp
  irrd:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: irrd
    depends_on:
      - irrd_postgres
      - irrd_redis
    networks:
      - irrd
    platform: linux/amd64
    ports:
      - mode: host
        protocol: tcp
        published: 43
        target: 43
      - mode: host
        protocol: tcp
        published: 8000
        target: 8000
      - mode: host
        protocol: tcp
        published: 8080
        target: 8080
    restart: unless-stopped
    volumes:
      - type: bind
        source: ./irrd.yaml
        target: /opt/irrd/irrd.yaml
      - type: bind
        source: ./irrexplorer.yaml
        target: /opt/irrexplorer/irrexplorer.yaml
  ## IRRd Database ##
  # Ports: 5432/tcp
  irrd_postgres:
    command:
      [
        "-c",
        "random_page_cost=1.0",
        "-c",
        "work_mem=50MB",
        "-c",
        "shared_buffers=1GB",
        "-c",
        "max_connections=1000",
      ]
    container_name: irrd_postgres
    environment:
      - "PGDATA=/var/lib/postgresql/data/pgdata"
      - "POSTGRES_DB=irrd"
      - "POSTGRES_PASSWORD=irrd"
      - "POSTGRES_USER=irrd"
    image: "postgres:18.7-alpine@sha256:75dcac3dfb1cd01ca3536910bbc84128759362f8b118bf8c55b38a94f68f3b73"
    networks:
      - irrd
    restart: unless-stopped
    volumes:
      - type: volume
        source: irrd_postgres
        target: /var/lib/postgresql/data/
  ## IRRd Redis ##
  # Ports: 6379/tcp
  irrd_redis:
    container_name: irrd_redis
    image: "redis:8.10.3-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3"
    networks:
      - irrd
    restart: unless-stopped
    volumes:
      - source: redis
        target: /data
        type: volume
networks:
  irrd:
    name: irrd
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 10.42.0.0/24
        - subnet: fdea:420:cafe::/64
volumes:
  irrd_postgres:
    name: irrd_postgres
  redis:
    name: redis
